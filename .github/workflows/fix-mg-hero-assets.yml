name: Fix generated hero assets

on:
  push:
    branches:
      - fix-transparent-guide-hero-images

permissions:
  contents: write

jobs:
  fix-hero-assets:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-transparent-guide-hero-images

      - name: Generate true transparent hero assets and update pages
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import shutil
          import subprocess
          from pathlib import Path

          subprocess.check_call(['python', '-m', 'pip', 'install', '--no-input', '--quiet', 'pillow'])
          from PIL import Image, ImageOps, ImageFilter
          import numpy as np

          root = Path('.')
          raw_dir = root / 'tmp-mg-hero-raw'
          raw_dir.mkdir(exist_ok=True)

          assets = [
              {
                  'page': 'submit',
                  'url': 'https://github.com/user-attachments/assets/2d991d0d-d837-4186-adf2-27a6b109feeb',
                  'file': 'submit-correction-pencil.png',
                  'path': '/assets/submit/submit-correction-pencil.png',
              },
              {
                  'page': 'stats',
                  'url': 'https://github.com/user-attachments/assets/e1d15a8a-6ad5-4bad-b15f-8a2cc0825cc2',
                  'file': 'stats-ledger-chart.png',
                  'path': '/assets/stats/stats-ledger-chart.png',
              },
              {
                  'page': 'methodology',
                  'url': 'https://github.com/user-attachments/assets/4955582b-02de-4ce9-9918-73942f6612d9',
                  'file': 'methodology-field-notes.png',
                  'path': '/assets/methodology/methodology-field-notes.png',
              },
              {
                  'page': 'about',
                  'url': 'https://github.com/user-attachments/assets/072b4039-553a-4aea-aecf-e062b1932660',
                  'file': 'about-archive-cabinet.png',
                  'path': '/assets/about/about-archive-cabinet.png',
              },
              {
                  'page': 'contact',
                  'url': 'https://github.com/user-attachments/assets/afcf020a-5e06-44e9-bec5-78b2d9e451cf',
                  'file': 'contact-archive-envelope.png',
                  'path': '/assets/contact/contact-archive-envelope.png',
              },
              {
                  'page': 'support',
                  'url': 'https://github.com/user-attachments/assets/7b3784aa-09fe-434e-9c5d-4baf1483ecda',
                  'file': 'support-preservation-box.png',
                  'path': '/assets/support/support-preservation-box.png',
              },
          ]

          def run(cmd):
              subprocess.check_call(cmd)

          def remove_checkerboard_to_alpha(src: Path) -> Image.Image:
              img = Image.open(src).convert('RGBA')
              arr = np.array(img).astype(np.float32)
              rgb = arr[..., :3]
              mx = rgb.max(axis=2)
              mn = rgb.min(axis=2)
              chroma = mx - mn
              mean = rgb.mean(axis=2)
              bg = (mean > 218) & (chroma < 18)
              bg |= (mean > 206) & (chroma < 12)
              alpha = np.where(bg, 0, 255).astype(np.uint8)
              mask = Image.fromarray(alpha, mode='L')
              mask = mask.filter(ImageFilter.MedianFilter(3))
              mask = mask.filter(ImageFilter.GaussianBlur(0.35))
              out = img.copy()
              out.putalpha(mask)
              bbox = out.getbbox()
              if bbox:
                  out = out.crop(bbox)
              out = ImageOps.expand(out, border=36, fill=(255, 255, 255, 0))
              return out

          manifest = []
          for item in assets:
              raw = raw_dir / item['file']
              run(['curl', '-L', '--fail', '--retry', '3', item['url'], '-o', str(raw)])
              out = remove_checkerboard_to_alpha(raw)
              target = root / 'public' / 'assets' / item['page'] / item['file']
              target.parent.mkdir(parents=True, exist_ok=True)
              out.save(target, 'PNG', optimize=True)
              alpha = np.array(out.getchannel('A'))
              manifest.append({
                  'page': item['page'],
                  'path': str(target),
                  'width': out.width,
                  'height': out.height,
                  'transparent_pixel_count': int((alpha == 0).sum()),
                  'semi_transparent_pixel_count': int(((alpha > 0) & (alpha < 255)).sum()),
              })

          # Replace PR #30 attachment URLs with repo-local paths.
          replacements = {
              'src="https://github.com/user-attachments/assets/2d991d0d-d837-4186-adf2-27a6b109feeb"': 'src="/assets/submit/submit-correction-pencil.png"',
              'src="https://github.com/user-attachments/assets/e1d15a8a-6ad5-4bad-b15f-8a2cc0825cc2"': 'src="/assets/stats/stats-ledger-chart.png"',
              'src="https://github.com/user-attachments/assets/072b4039-553a-4aea-aecf-e062b1932660"': 'src="/assets/about/about-archive-cabinet.png"',
          }
          for rel in ['src/pages/submit.astro', 'src/pages/stats.astro', 'src/pages/about.astro']:
              path = root / rel
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          # Add image markup to pages that still have old symbolic art.
          page_specs = {
              'src/pages/methodology.astro': {
                  'old': '<div class="hero-botanical mushroom" aria-hidden="true">♧</div>',
                  'new': '<figure class="hero-botanical hero-page-art" aria-hidden="true"><img src="/assets/methodology/methodology-field-notes.png" alt="" loading="eager" /></figure>',
              },
              'src/pages/contact.astro': {
                  'old': '<div class="hero-botanical mushroom" aria-hidden="true">✉</div>',
                  'new': '<figure class="hero-botanical hero-page-art" aria-hidden="true"><img src="/assets/contact/contact-archive-envelope.png" alt="" loading="eager" /></figure>',
              },
              'src/pages/support.astro': {
                  'old': '<div class="support-hero-art" aria-hidden="true">☘</div>',
                  'new': '<figure class="support-hero-art support-hero-image" aria-hidden="true"><img src="/assets/support/support-preservation-box.png" alt="" loading="eager" /></figure>',
              },
          }
          for rel, spec in page_specs.items():
              path = root / rel
              text = path.read_text()
              if spec['old'] not in text:
                  raise SystemExit(f'Missing expected markup in {rel}')
              path.write_text(text.replace(spec['old'], spec['new']))

          (root / 'docs').mkdir(exist_ok=True)
          (root / 'docs' / 'generated-hero-assets-manifest.json').write_text(json.dumps({
              'note': 'Generated from issue attachment URLs, checkerboard background removed, true alpha PNGs written to public/assets.',
              'assets': manifest,
          }, indent=2) + '\n')

          shutil.rmtree(raw_dir, ignore_errors=True)
          workflow = root / '.github' / 'workflows' / 'fix-mg-hero-assets.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit corrected hero assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add public/assets src/pages docs/generated-hero-assets-manifest.json .github/workflows/fix-mg-hero-assets.yml
          git commit -m "Fix generated hero asset transparency"
          git push origin fix-transparent-guide-hero-images
