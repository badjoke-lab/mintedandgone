name: MAG Phase 5 Reviewed Production Evidence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase5-reviewed-production-evidence.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mag-phase5-reviewed-production-evidence
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MAG_PRODUCTION_ORIGIN: https://mag.badjoke-lab.com
      PHASE5_IMPLEMENTATION_FLOOR: d5c6c56dd787cbf3ae09ba2df83f97c15bbefcad
    steps:
      - name: Publish pending reviewed-production status
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'mag-phase5-reviewed-production',
              description: 'Reviewed production floor verification running',
              target_url: targetUrl
            });

      - name: Checkout reviewed main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify current reviewed production
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-phase5-reviewed-production.mjs "$PHASE5_IMPLEMENTATION_FLOOR" 2>&1 | tee phase5-reviewed-production.log

      - name: Upload reviewed-production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mag-phase5-reviewed-production-${{ github.sha }}
          path: phase5-reviewed-production.log
          if-no-files-found: warn

      - name: Publish successful reviewed-production status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'mag-phase5-reviewed-production',
              description: 'Reviewed production floor verification passed',
              target_url: targetUrl
            });

      - name: Publish failed reviewed-production status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'mag-phase5-reviewed-production',
              description: 'Reviewed production floor verification failed',
              target_url: targetUrl
            });
