name: Validate data and build

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generate stats
        run: npm run generate:stats
      - name: Generate sitemap
        run: npm run generate:sitemap
      - name: Validate data
        continue-on-error: true
        run: npm run validate > validate-data.log 2>&1
      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: validate-data-log
          path: validate-data.log
      - name: Validate candidate backlog
        run: npm run validate:candidates
      - name: Validate latest marketplace batch
        run: npm run validate:latest-batch
      - name: Build site
        run: npm run build:site
