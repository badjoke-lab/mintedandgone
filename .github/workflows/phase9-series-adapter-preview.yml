name: Phase 9 Series Adapter Preview Verification

on:
  pull_request:
    paths:
      - 'package.json'
      - 'scripts/generate-public-registry-all.mjs'
      - 'scripts/generate-series-adapter.mjs'
      - 'scripts/validate-series-adapter.mjs'
      - 'scripts/check-series-origin.mjs'
      - '.github/workflows/phase9-series-adapter-preview.yml'

permissions:
  contents: read

concurrency:
  group: phase9-series-adapter-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview:
    if: github.head_ref == 'agent/phase9-series-adapter'
    runs-on: ubuntu-latest
    env:
      SERIES_ORIGIN: https://agent-phase9-series-adapter.mintedandgone.pages.dev
      SERIES_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      SERIES_VERIFY_ATTEMPTS: 20
      SERIES_VERIFY_INTERVAL_MS: 15000
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --progress=false
      - name: Generate native and Series public layers locally
        run: npm run generate:stats
      - name: Validate local Series adapter
        run: npm run validate:series
      - name: Verify representative Series adapter on Cloudflare preview
        run: node scripts/check-series-origin.mjs
