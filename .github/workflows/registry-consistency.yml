name: Registry consistency

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate canonical public registry
        id: generator
        continue-on-error: true
        run: node scripts/generate-public-registry-all.mjs > registry-generator.log 2>&1
      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-generator-log
          path: registry-generator.log
      - name: Stop on generator failure
        if: steps.generator.outcome == 'failure'
        run: cat registry-generator.log && exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Check built registry
        id: built_check
        continue-on-error: true
        run: node scripts/check-built-registry.mjs > registry-built-check.log 2>&1
      - name: Upload built-registry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-built-check-log
          path: registry-built-check.log
      - name: Stop on built-registry failure
        if: steps.built_check.outcome == 'failure'
        run: cat registry-built-check.log && exit 1
