name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate stats
        run: npm run generate:stats

      - name: Generate sitemap
        run: npm run generate:sitemap

      - name: Validate canonical data
        run: npm run validate

      - name: Validate candidate backlog
        run: npm run validate:candidates

      - name: Validate latest batch duplicates
        run: npm run validate:latest-batch

      - name: Validate tokenized collectibles
        run: npm run validate:tokenized

      - name: Build site
        run: npm run build:site
