name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate stats
        run: npm run generate:stats

      - name: Generate sitemap
        run: npm run generate:sitemap

      - name: Validate canonical data
        run: npm run validate

      - name: Validate candidate backlog
        run: npm run validate:candidates

      - name: Validate latest batch duplicates
        run: npm run validate:latest-batch

      - name: Validate tokenized collectibles
        id: tokenized
        continue-on-error: true
        run: npm run validate:tokenized > tokenized-integrity.log 2>&1

      - name: Upload tokenized validation failure
        if: steps.tokenized.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tokenized-integrity-log
          path: tokenized-integrity.log

      - name: Stop after tokenized validation failure
        if: steps.tokenized.outcome == 'failure'
        run: exit 1

      - name: Test tokenized monitoring logic
        run: npm run test:monitoring:tokenized

      - name: Run tokenized monitoring dry run
        run: npm run monitor:tokenized

      - name: Smoke test tokenized report writer
        run: npm run monitor:tokenized:smoke

      - name: Verify tokenized smoke outputs
        run: |
          test -f .tmp/tokenized-monitoring/latest/report.json
          test -f .tmp/tokenized-monitoring/latest/summary.md

      - name: Verify backlog-only findings do not write a report
        run: |
          rm -rf .tmp/tokenized-backlog-policy
          node scripts/monitoring-tokenized-run.mjs --publish --output-root=.tmp/tokenized-backlog-policy
          test ! -f .tmp/tokenized-backlog-policy/latest/report.json

      - name: Run post-fix live tokenized verification
        shell: bash
        run: |
          set -o pipefail
          rm -rf .tmp/tokenized-live-recheck
          node scripts/monitoring-tokenized-run.mjs \
            --live \
            --force-report \
            --output-root=.tmp/tokenized-live-recheck \
            2>&1 | tee .tmp/tokenized-live-recheck.log

      - name: Verify post-fix live report
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.tmp/tokenized-live-recheck/latest/report.json','utf8'));if(r.canonical_files_modified)process.exit(1);if(r.summary.critical!==0||r.summary.high!==0||r.summary.medium!==0)process.exit(1);if(r.summary.backlog_findings!==5)process.exit(1);console.log(JSON.stringify(r.summary));"

      - name: Upload post-fix live verification
        uses: actions/upload-artifact@v4
        with:
          name: tokenized-live-recheck
          path: |
            .tmp/tokenized-live-recheck
            .tmp/tokenized-live-recheck.log

      - name: Build site
        run: npm run build:site
