name: MAG Phase 5 Production Verification

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit expected on production
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: mag-phase5-production-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_commit || github.sha }}
      MAG_PRODUCTION_ORIGIN: https://mag.badjoke-lab.com
      MAG_PRODUCTION_VERIFY_ATTEMPTS: 30
      MAG_PRODUCTION_VERIFY_DELAY_MS: 10000
    steps:
      - name: Publish pending production status
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXPECTED_COMMIT,
              state: 'pending',
              context: 'mag-phase5-production',
              description: 'Exact production verification running',
              target_url: targetUrl
            });

      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact production surfaces
        id: production_verify
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-phase5-production.mjs "$EXPECTED_COMMIT" 2>&1 | tee phase5-production-verification.log

      - name: Upload production verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mag-phase5-production-verification-${{ env.EXPECTED_COMMIT }}
          path: phase5-production-verification.log
          if-no-files-found: warn

      - name: Publish successful production status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXPECTED_COMMIT,
              state: 'success',
              context: 'mag-phase5-production',
              description: 'Exact production verification passed',
              target_url: targetUrl
            });

      - name: Publish failed production status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EXPECTED_COMMIT,
              state: 'failure',
              context: 'mag-phase5-production',
              description: 'Exact production verification failed',
              target_url: targetUrl
            });
