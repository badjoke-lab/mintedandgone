name: Tokenized Collectibles Monitoring

on:
  push:
    branches:
      - main
    paths:
      - docs/initial-live-monitoring-trigger.md
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tokenized-collectibles-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore URL state
        uses: actions/cache@v4
        with:
          path: .monitoring-state
          key: tokenized-url-state-${{ github.run_id }}
          restore-keys: |
            tokenized-url-state-

      - name: Run live monitoring
        id: live_monitor
        continue-on-error: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .monitoring-state
          npm run monitor:tokenized:live:publish -- --url-state=.monitoring-state/url-state.json 2>&1 | tee .monitoring-state/live-monitoring.log

      - name: Guard canonical files
        id: canonical_guard
        shell: bash
        run: |
          if git status --porcelain -- data | grep -E 'data/(marketplaces|events|evidence).*\.json'; then
            echo "Monitoring changed canonical data."
            exit 1
          fi

      - name: Record initial live observation
        if: always() && github.event_name == 'push'
        env:
          LIVE_OUTCOME: ${{ steps.live_monitor.outcome }}
          GUARD_OUTCOME: ${{ steps.canonical_guard.outcome }}
        shell: bash
        run: |
          output_dir="data-staging/monitoring/tokenized-collectibles/initial-live-verification"
          mkdir -p "$output_dir"
          report_exists=false
          if [ -f data-staging/monitoring/tokenized-collectibles/latest/report.json ]; then
            report_exists=true
          fi
          cat > "$output_dir/verification.json" <<EOF
          {
            "schema_version": 1,
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit_sha": "${GITHUB_SHA}",
            "event_name": "${GITHUB_EVENT_NAME}",
            "live_monitor_outcome": "${LIVE_OUTCOME}",
            "canonical_guard_outcome": "${GUARD_OUTCOME}",
            "report_exists": ${report_exists},
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          if [ -f .monitoring-state/live-monitoring.log ]; then
            cp .monitoring-state/live-monitoring.log "$output_dir/live-monitoring.log"
          fi

      - name: Publish initial verification branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/tokenized-live-verification
          git add data-staging/monitoring/tokenized-collectibles
          git commit -m "Record initial tokenized live monitoring verification"
          git push --force origin auto/tokenized-live-verification

      - name: Detect monitoring output
        if: github.event_name != 'push'
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- data-staging/monitoring/tokenized-collectibles)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update monitoring pull request
        if: github.event_name != 'push' && steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: Add tokenized collectibles monitoring report
          branch: auto/tokenized-collectibles-monitoring
          delete-branch: true
          title: Auto monitoring report: Tokenized Collectibles
          body-path: data-staging/monitoring/tokenized-collectibles/latest/summary.md
          add-paths: |
            data-staging/monitoring/tokenized-collectibles/**

      - name: Fail after publishing initial verification
        if: always() && github.event_name == 'push' && (steps.live_monitor.outcome == 'failure' || steps.canonical_guard.outcome == 'failure')
        run: exit 1
